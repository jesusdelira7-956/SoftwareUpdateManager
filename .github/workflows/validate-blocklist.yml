name: Validate PUP Blocklist Schema

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'pup_blocklist.json'

permissions:
  contents: read

jobs:
  validate-json-schema:
    name: Validate pup_blocklist.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run blocklist schema & safety validator
        run: python scripts/validate_blocklist.py
