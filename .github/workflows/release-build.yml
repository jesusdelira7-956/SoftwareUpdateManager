name: Build & Publish Windows Release (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to create/update a GitHub Release (e.g. v2.5.0)'
        required: false
        default: 'v2.5.0'

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Compile Standalone SoftwareUpdateManager.exe
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate PUP blocklist schema & safety
        run: python scripts/validate_blocklist.py

      - name: Verify Python syntax (100% Standard Library modules)
        run: python -m py_compile update_manager.py security_auditor.py network_auditor.py agent_bridge.py

      - name: Install PyInstaller compiler
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compile standalone SoftwareUpdateManager.exe
        run: python build_exe.py

      - name: Generate SHA-256 cryptographic checksum
        shell: pwsh
        run: |
          $exePath = "dist/SoftwareUpdateManager.exe"
          if (-Not (Test-Path $exePath)) {
            Write-Error "Compiled binary not found at $exePath"
            exit 1
          }
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          "$hash  SoftwareUpdateManager.exe" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding utf8
          Write-Host "Generated SHA-256: $hash"

      - name: Upload compiled binary to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoftwareUpdateManager-Windows-x64
          path: |
            dist/SoftwareUpdateManager.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "🛡️ Software Update Manager ${{ github.event.inputs.release_tag || github.ref_name }} — AI Agent Bridge & Intrusion Shield"
          generate_release_notes: true
          files: |
            dist/SoftwareUpdateManager.exe
            dist/SHA256SUMS.txt
